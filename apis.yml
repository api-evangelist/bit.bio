aid: bit.bio
name: Bit.bio
description: 'bit.bio is a Cambridge, UK synthetic biology company founded in 2016 by
  stem cell biologist and neurosurgeon Mark Kotter, headquartered at the Babraham Research
  Campus with a second site in San Francisco and a discovery subsidiary (bit.bio discovery
  GmbH) in Vienna. Its proprietary opti-ox cell coding technology uses a dual genomic
  safe harbour approach to deterministically reprogram human induced pluripotent stem
  cells (iPSCs) into defined, consistent human cell types at industrial scale. The
  company sells these as ioCells — ioWild Type Cells, ioDisease Model Cells and CRISPR-Ready
  ioCells covering neurons, microglia, hepatocytes, glial and muscle lineages — plus
  custom iPSC-derived cell development and expert-led CRISPR functional genomics screening
  services for research, drug discovery and cell therapy. Products are sold as physical
  cell vials through a web storefront and a distributor network; bit.bio publishes no
  developer program, public API, or machine-readable API contract.'
